name: Daily Semiconductor Timing

on:
  workflow_dispatch:
  schedule:
    # 06:00 Asia/Seoul = 21:00 UTC on the previous calendar day.
    - cron: "0 21 * * *"

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: semiconductor-timing
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: semiconductor-timing/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send semiconductor timing report
        run: python scripts/run_daily.py
        env:
          DRY_RUN: "0"
          TIMEZONE: Asia/Seoul
          DB_PATH: data/timing.db
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
