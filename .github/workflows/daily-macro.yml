name: Daily Macro Brief

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 0-4"

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python macro_brief.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: qwen/qwen3-32b:free
          OPENROUTER_SITE_URL: https://github.com/curihy/daily-telegram-macro-brief
          OPENROUTER_APP_NAME: Daily Korean Semiconductor Brief
          REPORT_TITLE: AI Semiconductor 6AM
          TIMEZONE: Asia/Seoul
