[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semiconductor-timing"
version = "0.1.0"
description = "Daily Korean semiconductor timing report MVP"
requires-python = ">=3.9"
dependencies = [
  "pandas==2.2.3",
  "pydantic==2.10.6",
  "python-dotenv==1.0.1",
  "requests==2.32.3",
  "urllib3==1.26.20",
  "yfinance==0.2.66",
  "beautifulsoup4==4.14.3",
  "pykrx==1.0.51",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
